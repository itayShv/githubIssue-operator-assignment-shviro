# This rule is not used by the project githubissue-operator-assignment-shviro itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over github.itayshviro.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: githubissue-operator-assignment-shviro
    app.kubernetes.io/managed-by: kustomize
  name: githubissue-admin-role
rules:
- apiGroups:
  - github.itayshviro.dev
  resources:
  - githubissues
  verbs:
  - '*'
- apiGroups:
  - github.itayshviro.dev
  resources:
  - githubissues/status
  verbs:
  - get
