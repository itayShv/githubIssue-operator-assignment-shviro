# This rule is not used by the project githubissue-operator-assignment-shviro itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the github.itayshviro.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: githubissue-operator-assignment-shviro
    app.kubernetes.io/managed-by: kustomize
  name: githubissue-editor-role
rules:
- apiGroups:
  - github.itayshviro.dev
  resources:
  - githubissues
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - github.itayshviro.dev
  resources:
  - githubissues/status
  verbs:
  - get
